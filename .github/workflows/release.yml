name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check whether this immutable version already exists
        id: registry
        run: |
          release_package_name=$(node -p "require('./package.json').name")
          release_package_version=$(node -p "require('./package.json').version")
          if npm view "$release_package_name@$release_package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
